<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СКИТАЛЕЦ - 3D Меню</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#070e1f;font-family:\'Cinzel\',serif}
#canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.top-title{margin-top:32px;text-align:center}
.top-title h1{
  font-family:\'Cinzel Decorative\',serif;font-size:58px;font-weight:900;letter-spacing:0.22em;
  background:linear-gradient(to bottom,#fff6d0 15%,#e8b86a 55%,#8a5a1a 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 0 #1a0e00) drop-shadow(0 0 25px rgba(255,180,40,0.5));
}
.top-title p{margin-top:8px;font-size:10px;letter-spacing:0.55em;color:#9a8a6a;text-transform:uppercase}
.menu{margin-top:auto;margin-bottom:38px;display:flex;flex-direction:column;gap:13px;width:340px;pointer-events:auto}
.btn{
  width:100%;padding:15px 0;cursor:pointer;text-transform:uppercase;letter-spacing:0.22em;font-size:13px;font-weight:700;
  font-family:\'Cinzel\',serif;color:#ffe9b0;background:linear-gradient(to bottom,rgba(30,22,10,0.9),rgba(12,8,2,0.95));
  border:1px solid #8a6a2e;box-shadow:0 0 0 1px #1a1205 inset,0 8px 20px rgba(0,0,0,0.6);
  backdrop-filter:blur(8px);transition:0.25s;position:relative;overflow:hidden;
}
.btn:hover{border-color:#d4a85c;color:#fff;transform:translateY(-1px);box-shadow:0 0 0 1px #d4a85c inset,0 10px 26px rgba(0,0,0,0.7),0 0 28px rgba(255,160,30,0.35)}
.btn-main{
  background:linear-gradient(to bottom,#e8c07a,#c8962e 55%,#8a5a12 100%);
  color:#1a0f00;border-color:#ffe9b0;box-shadow:0 0 0 1px #fff6cc inset,0 10px 26px rgba(0,0,0,0.6),0 0 32px rgba(255,180,40,0.5)
}
.btn-main:hover{background:linear-gradient(to bottom,#ffdb94,#d4a53a)}
.row{display:flex;gap:13px}.row .btn{font-size:11px;padding:13px 0}
.version{position:fixed;bottom:12px;right:16px;z-index:10;font-size:9px;letter-spacing:0.18em;color:rgba(255,255,255,0.3);font-family:sans-serif}
.vignette{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.72) 100%)}
</style>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="vignette"></div>
<div class="ui">
  <div class="top-title">
    <h1>СКИТАЛЕЦ</h1>
    <p>Ночь холодна — но костёр ещё горит</p>
  </div>
  <nav class="menu">
    <button class="btn btn-main" onclick="playClick()">▶ Играть</button>
    <div class="row">
      <button class="btn" onclick="alert(\'⚙️ Настройки: Громкость, Яркость, Тени\')">Настройки</button>
      <button class="btn" onclick="if(confirm(\'Покинуть привал?\')) window.close()">Выход</button>
    </div>
  </nav>
</div>
<div class="version">v 1.1 • THREE.JS • 3D CAMP FIXED</div>

<script>
const canvas = document.getElementById(\'canvas\');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1428);
scene.fog = new THREE.Fog(0x0d1428, 10, 28);

const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 7.2);
window.addEventListener(\'resize\', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// СВЕТ
scene.add(new THREE.HemisphereLight(0x8aa0c8, 0x0a0a0a, 0.6));
const moonLight = new THREE.DirectionalLight(0xcfe0ff, 1.0);
moonLight.position.set(-6, 8, 4);
moonLight.castShadow = true;
scene.add(moonLight);

const fireLight = new THREE.PointLight(0xff7a18, 4, 10);
fireLight.position.set(0.2, 0.7, 0.3);
scene.add(fireLight);
const fireFill = new THREE.PointLight(0xff3200, 1.5, 5);
fireFill.position.set(0, 0.3, 0);
scene.add(fireFill);

// ЛУНА
const moon = new THREE.Mesh(new THREE.SphereGeometry(1.15, 32, 32), new THREE.MeshStandardMaterial({color:0xfff6d6, emissive:0xfff0b0, emissiveIntensity:0.35}));
moon.position.set(13, 10, -20);
scene.add(moon);

// ЗВЕЗДЫ
const starGeo = new THREE.BufferGeometry();
const starPos = [];
for(let i=0;i<800;i++){
  starPos.push((Math.random()-0.5)*60, 6+Math.random()*20, -15 -Math.random()*20);
}
starGeo.setAttribute(\'position\', new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({size:0.18, color:0xffffff, transparent:true, opacity:0.75})));

// ЗЕМЛЯ
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({color:0x1e2218, roughness:1}));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ГОРЫ на заднем плане
function mountain(x, z, h, w, color){
  const geo = new THREE.ConeGeometry(w, h, 4);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, roughness:1}));
  m.position.set(x, h/2, z);
  m.rotation.y = Math.PI/4;
  m.scale.z = 0.5;
  return m;
}
scene.add(mountain(-2, -14, 6, 4.5, 0x141e32));
scene.add(mountain(3, -15, 7.5, 5, 0x162540));
scene.add(mountain(7, -13, 4, 3, 0x0f1a2e));
const snow = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.2, 4), new THREE.MeshStandardMaterial({color:0xeef2ff}));
snow.position.set(3, 6.8, -15); snow.rotation.y = Math.PI/4; snow.scale.z=0.5;
scene.add(snow);

// КАМНИ ВОКРУГ КОСТРА
const stoneMat = new THREE.MeshStandardMaterial({color:0x3d352e, roughness:0.95});
for(let i=0;i<10;i++){
  const a = (i/10)*Math.PI*2;
  const r = 0.85 + Math.random()*0.18;
  const s = 0.25 + Math.random()*0.12;
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(s,0), stoneMat);
  rock.position.set(Math.cos(a)*r, s*0.5, Math.sin(a)*r);
  rock.rotation.set(Math.random(), Math.random(), 0);
  rock.castShadow=true; rock.receiveShadow=true;
  scene.add(rock);
}

// БРЕВНА
const logMat = new THREE.MeshStandardMaterial({color:0x3d2412, roughness:0.9});
const log1 = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,1.3, 8), logMat);
log1.rotation.z=Math.PI/2.3; log1.position.set(-0.28,0.18,0.1); scene.add(log1);
const log2 = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,1.3,8), logMat);
log2.rotation.z=-Math.PI/2.3; log2.position.set(0.3,0.18,0.05); scene.add(log2);

// ОГОНЬ
const flameGroup = new THREE.Group();
flameGroup.position.set(0.05, 0.25, 0);
const f1 = new THREE.Mesh(new THREE.ConeGeometry(0.32,0.85,12), new THREE.MeshBasicMaterial({color:0xff6a00, transparent:true, opacity:0.95}));
f1.position.y=0.35; flameGroup.add(f1);
const f2 = new THREE.Mesh(new THREE.ConeGeometry(0.20,0.6,12), new THREE.MeshBasicMaterial({color:0xffc83a, transparent:true, opacity:0.9}));
f2.position.y=0.32; flameGroup.add(f2);
const f3 = new THREE.Mesh(new THREE.ConeGeometry(0.10,0.35,12), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.9}));
f3.position.y=0.30; flameGroup.add(f3);
scene.add(flameGroup);

// ИСКРЫ
const sparkGeo = new THREE.BufferGeometry();
const sparkPosArr = new Float32Array(80*3);
for(let i=0;i<80;i++){
  sparkPosArr[i*3]= (Math.random()-0.5)*0.6;
  sparkPosArr[i*3+1]= Math.random()*0.5;
  sparkPosArr[i*3+2]= (Math.random()-0.5)*0.6;
}
sparkGeo.setAttribute(\'position\', new THREE.BufferAttribute(sparkPosArr,3));
const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({color:0xff8c1a, size:0.07, transparent:true, opacity:0.9, blending:THREE.AdditiveBlending, depthWrite:false}));
scene.add(sparks);

// БОЧКА
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,1.15,16), new THREE.MeshStandardMaterial({color:0x2b1d0f}));
barrel.position.set(-2.35,0.58,0.55); barrel.castShadow=true; scene.add(barrel);
const hoopMat=new THREE.MeshStandardMaterial({color:0x111111, metalness:0.6});
[-0.3,0,0.3].forEach(y=>{
  const hoop=new THREE.Mesh(new THREE.TorusGeometry(0.63,0.03,8,20), hoopMat);
  hoop.rotation.x=Math.PI/2; hoop.position.set(-2.35,0.58+y,0.55); scene.add(hoop);
});

// ПУТЕШЕСТВЕННИК на бочке / рядом
const traveler=new THREE.Group();
traveler.position.set(-1.15,0,0.55);
traveler.rotation.y=0.55;
const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.32,0.6,4,10), new THREE.MeshStandardMaterial({color:0x0f1820}));
body.position.y=0.72; traveler.add(body);
const leg1Mesh=new THREE.Mesh(new THREE.CapsuleGeometry(0.13,0.5,4,8), new THREE.MeshStandardMaterial({color:0x0d1218}));
leg1Mesh.position.set(0.16,0.32,0.34); leg1Mesh.rotation.x=-0.9; traveler.add(leg1Mesh);
const leg2Mesh=new THREE.Mesh(new THREE.CapsuleGeometry(0.13,0.5,4,8), new THREE.MeshStandardMaterial({color:0x0d1218}));
leg2Mesh.position.set(-0.1,0.3,0.3); leg2Mesh.rotation.x=-0.7; leg2Mesh.rotation.z=0.4; traveler.add(leg2Mesh);
const hood=new THREE.Mesh(new THREE.SphereGeometry(0.30,16,16,0,Math.PI*2,0,Math.PI*0.8), new THREE.MeshStandardMaterial({color:0x070c14, side:THREE.DoubleSide}));
hood.position.set(0,1.08,0.04); hood.rotation.x=Math.PI; traveler.add(hood);
const face=new THREE.Mesh(new THREE.SphereGeometry(0.17,12,12), new THREE.MeshStandardMaterial({color:0x0a0a0a}));
face.position.set(0,1.03,0.12); traveler.add(face);
const eye=new THREE.Mesh(new THREE.SphereGeometry(0.024,6,6), new THREE.MeshBasicMaterial({color:0xff5a00}));
eye.position.set(0.06,1.05,0.26); traveler.add(eye);
scene.add(traveler);

// ПРЕДМЕТЫ У КОСТРА - кинжал + монеты
const dagger=new THREE.Group(); dagger.position.set(-0.45,0.05,1.0); dagger.rotation.y=0.8;
const blade=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.015,0.05), new THREE.MeshStandardMaterial({color:0xd0d8e0, metalness:0.8}));
blade.position.x=0.18; dagger.add(blade);
const guard=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.02,0.12), new THREE.MeshStandardMaterial({color:0x8a6a2e}));
dagger.add(guard);
scene.add(dagger);
for(let i=0;i<12;i++){
  const c=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.01,10), new THREE.MeshStandardMaterial({color:0xd4a84a, metalness:0.6}));
  c.position.set(-0.62+Math.random()*0.3, 0.01, 0.92+Math.random()*0.2); scene.add(c);
}

// ВОЛК на горе
const wolf=new THREE.Group(); wolf.position.set(9, 2.2, -9);
const wBody=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.3,0.2), new THREE.MeshStandardMaterial({color:0x020205}));
wBody.position.y=0.3; wolf.add(wBody);
const wHead=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.2,0.2), new THREE.MeshStandardMaterial({color:0x020205}));
wHead.position.set(0.4,0.45,0); wolf.add(wHead);
const wEye=new THREE.Mesh(new THREE.SphereGeometry(0.03,6,6), new THREE.MeshBasicMaterial({color:0xff3300}));
wEye.position.set(0.51,0.48,0.06); wolf.add(wEye);
const wEye2=wEye.clone(); wEye2.position.z=-0.06; wolf.add(wEye2);
wolf.scale.set(0.6,0.6,0.6);
scene.add(wolf);

// АНИМАЦИЯ
let t=0;
function animate(){
  requestAnimationFrame(animate);
  t+=0.016;
  fireLight.intensity = 3 + Math.sin(t*9)*0.4 + Math.random()*0.4;
  flameGroup.scale.y = 1 + Math.sin(t*10)*0.08;
  flameGroup.scale.x = 1 + Math.sin(t*7)*0.05;
  f1.rotation.y += 0.02; f2.rotation.y -=0.03;
  // искры вверх
  const pos = sparkGeo.attributes.position;
  for(let i=0;i<80;i++){
    let y = pos.getY(i);
    y += 0.028 + Math.random()*0.02;
    let x = pos.getX(i) + Math.sin(t*2+i)*0.002;
    if(y>3.2){ y=Math.random()*0.2; x=(Math.random()-0.5)*0.5; }
    pos.setY(i, y); pos.setX(i, x);
  }
  pos.needsUpdate=true;
  traveler.position.y = Math.sin(t*1.2)*0.012;
  renderer.render(scene, camera);
}
animate();

// параллакс мышкой
addEventListener(\'mousemove\', e=>{
  const nx = (e.clientX/innerWidth -0.5);
  camera.position.x = nx * 1.2;
  camera.lookAt(0, 0.4, 0);
});

function playClick(){
  document.body.style.transition=\'filter 1s\';
  document.body.style.filter=\'brightness(2) blur(6px)\';
  setTimeout(()=>{ document.body.style.filter=\'\'; alert(\'⚔️ Путь начинается!\'); }, 900);
}
</script>
</body>
</html>
