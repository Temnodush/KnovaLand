<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMBER PATH - Главное меню</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    height:100vh;
    overflow:hidden;
    background:#020510;
    font-family:\'Manrope\', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    perspective:1200px;
  }
  /* НЕБО */
  .sky{
    position:absolute;
    inset:0;
    background: radial-gradient(ellipse at 50% 20%, #1a2a5a 0%, #0b1126 45%, #020510 80%);
    overflow:hidden;
  }
  .stars{
    position:absolute; inset:0;
  }
  .star{
    position:absolute;
    width:2px; height:2px;
    background:white;
    border-radius:50%;
    opacity:0.7;
    animation: twinkle 3s infinite alternate;
    box-shadow:0 0 6px white;
  }
  @keyframes twinkle{0%{opacity:0.2; transform:scale(0.8)} 100%{opacity:1; transform:scale(1.4)}}

  .moon{
    position:absolute;
    top:6%; right:12%;
    width:90px; height:90px;
    background:radial-gradient(circle at 30% 30%, #fffef2, #e8e0b0 60%, #c9c09a);
    border-radius:50%;
    box-shadow:0 0 60px 20px rgba(255,240,180,0.4), 0 0 120px 40px rgba(100,130,255,0.15);
  }
  .moon::after{
    content:\'\';
    position:absolute;
    top:18px; left:22px;
    width:18px; height:18px;
    background:rgba(0,0,0,0.08);
    border-radius:50%;
    box-shadow: 25px 10px 0 -2px rgba(0,0,0,0.06), 15px 35px 0 -4px rgba(0,0,0,0.07);
  }

  /* ГОРЫ НА ЗАДНЕМ ПЛАНЕ */
  .mountains{
    position:absolute;
    bottom:18%;
    left:0; right:0;
    height:380px;
    background: linear-gradient(transparent, rgba(2,5,16,0.9));
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0.9;
  }
  .mountains svg{width:100%; height:100%;}

  /* СЦЕНА */
  .scene{
    position:relative;
    z-index:2;
    width:900px;
    height:520px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    transform-style:preserve-3d;
    transform:rotateX(8deg);
  }
  .ground{
    position:absolute;
    bottom:40px;
    width:1100px; height:380px;
    background: radial-gradient(ellipse at center, #1e3a1e 0%, #122412 35%, #0a160a 70%);
    border-radius:50%;
    filter:blur(0.5px);
    box-shadow: inset 0 40px 60px rgba(0,0,0,0.6);
    transform:rotateX(65deg);
  }
  .ground::after{
    content:\'\';
    position:absolute;
    inset:15%;
    background: radial-gradient(ellipse at 50% 40%, rgba(255,120,30,0.35) 0%, transparent 65%);
  }

  /* КОСТЕР */
  .campfire-wrap{
    position:absolute;
    bottom:110px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .fire{
    position:relative;
    width:90px; height:90px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .flame{
    position:absolute;
    bottom:18px;
    width:42px; height:65px;
    background: linear-gradient(to top, #ff3c00, #ff8c00 40%, #ffd23a 75%, #fffbe0);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    transform-origin:bottom center;
    animation: flicker 0.3s infinite alternate;
    filter:blur(0.3px);
    box-shadow:0 0 25px #ff6a00, 0 0 50px rgba(255,100,0,0.6);
  }
  .flame:nth-child(2){
    width:28px; height:45px;
    background: linear-gradient(to top, #ffed8a, #ffffff);
    opacity:0.9;
    animation-delay:0.15s;
    filter:blur(0.2px);
  }
  .flame:nth-child(3){
    width:60px; height:50px;
    background: linear-gradient(to top, #ff4500, transparent);
    opacity:0.4;
    animation-duration:0.5s;
  }
  @keyframes flicker{
    0%{transform:scaleY(1) scaleX(1) rotate(-1deg)}
    100%{transform:scaleY(1.15) scaleX(0.95) rotate(1deg)}
  }
  .logs{
    position:relative;
    width:90px; height:32px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:0;
    margin-top:-12px;
  }
  .log{
    width:70px; height:18px;
    background:linear-gradient(#3e2723, #1a0f0a);
    border-radius:10px;
    border:2px solid #281a12;
    position:absolute;
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.15);
  }
  .log1{transform:rotate(25deg)}
  .log2{transform:rotate(-25deg)}
  .stones{
    position:absolute;
    bottom:-8px;
    display:flex; gap:6px;
  }
  .stone{
    width:22px; height:14px;
    background:radial-gradient(ellipse at 30% 30%, #6a6e7a, #2e323d);
    border-radius:50% 50% 40% 40%;
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.2);
  }
  .light-glow{
    position:absolute;
    bottom:-35px;
    width:400px; height:180px;
    background: radial-gradient(ellipse at center, rgba(255,110,20,0.55) 0%, rgba(255,80,0,0.25) 30%, transparent 70%);
    filter:blur(12px);
    pointer-events:none;
  }
  .particles{
    position:absolute;
    bottom:30px;
    width:100px; height:100px;
    pointer-events:none;
  }
  .particle{
    position:absolute;
    width:3px; height:3px;
    background:#ffae42;
    border-radius:50%;
    box-shadow:0 0 6px #ff6a00;
    animation: rise 2.5s linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) scale(1); opacity:1}
    100%{transform:translateY(-120px) translateX(var(--x)) scale(0); opacity:0}
  }

  /* ПЕНЬКИ */
  .stump{
    position:absolute;
    bottom:95px;
    width:110px; height:75px;
    background: linear-gradient(to bottom, #4a2e1a 0%, #3d2411 40%, #26160c 100%);
    border-radius: 45% 45% 35% 35% / 30% 30% 70% 70%;
    border:3px solid #1a0e07;
    box-shadow: inset 0 12px 0 rgba(255,255,255,0.07), 0 10px 20px rgba(0,0,0,0.5);
    display:flex;
    justify-content:center;
  }
  .stump::before{
    content:\'\';
    position:absolute;
    top:6px;
    width:88px; height:28px;
    background: radial-gradient(ellipse at center, #6b4423 0%, #4a2e1a 60%, #35200f 100%);
    border-radius:50%;
    border:2px solid #1a0e07;
  }
  .stump::after{
    content:\'\';
    position:absolute;
    top:14px;
    width:60px; height:14px;
    background: repeating-radial-gradient(circle at center, #3d2411 0 2px, transparent 3px);
    opacity:0.3;
    border-radius:50%;
  }
  .stump.left{ left:18%; transform:rotateY(15deg) scale(0.95); }
  .stump.right{ right:18%; transform:rotateY(-15deg) scale(0.95); }
  .stump.center{ left:50%; transform:translateX(-50%) translateY(25px) scale(1.05); bottom:75px; z-index:4 }

  /* ПУТЕШЕСТВЕННИК */
  .traveler{
    position:absolute;
    bottom:155px;
    right:19.5%;
    width:110px; height:130px;
    z-index:6;
    transform:rotateY(-10deg);
  }
  .traveler-body{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:64px; height:72px;
    background: linear-gradient(#2f4d2f, #1e331e);
    border-radius:18px 18px 10px 10px;
    border:2px solid #0f1a0f;
  }
  .traveler-cloak{
    position:absolute;
    bottom:-5px;
    left:50%;
    transform:translateX(-50%);
    width:84px; height:85px;
    background: linear-gradient(#3a5a2a, #1c2e16);
    clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
    border-radius:0 0 12px 12px;
    z-index:-1;
  }
  .traveler-head{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:44px; height:44px;
    background: #e8c4a0;
    border-radius:50%;
    border:2px solid #5a3a1a;
    overflow:hidden;
  }
  .traveler-hood{
    position:absolute;
    top:-6px; left:50%;
    transform:translateX(-50%);
    width:56px; height:36px;
    background: linear-gradient(#4a6b35, #2e4220);
    border-radius: 28px 28px 12px 12px;
    border:2px solid #1a2612;
  }
  .traveler-hands{
    position:absolute;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    width:48px; height:22px;
    display:flex; justify-content:space-between;
  }
  .hand{
    width:18px; height:18px;
    background:#e8c4a0;
    border-radius:50%;
    border:1.5px solid #5a3a1a;
    animation: warm 1.2s ease-in-out infinite alternate;
  }
  @keyframes warm{
    0%{transform:translateY(0)}
    100%{transform:translateY(-3px) scale(1.05)}
  }

  /* ЗАГОЛОВОК И МЕНЮ */
  .title{
    position:absolute;
    top:7%;
    z-index:10;
    text-align:center;
    pointer-events:none;
  }
  .title h1{
    font-family:\'Cinzel\', serif;
    font-size:72px;
    font-weight:900;
    letter-spacing:12px;
    color:#fff8e1;
    text-shadow: 0 0 20px rgba(255,180,60,0.8), 0 6px 0 #3d2411, 0 12px 30px rgba(0,0,0,0.8);
    line-height:1;
  }
  .title p{
    margin-top:8px;
    font-size:13px;
    letter-spacing:8px;
    color:rgba(255,220,150,0.85);
    text-transform:uppercase;
    text-shadow:0 2px 10px rgba(0,0,0,0.8);
  }

  .menu-panel{
    position:absolute;
    bottom:28px;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    width:360px;
  }
  .btn{
    width:100%;
    padding:16px 0;
    font-family:\'Manrope\', sans-serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#fff8e1;
    background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.03));
    backdrop-filter: blur(14px);
    border:1px solid rgba(255,220,150,0.25);
    border-radius:14px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition: all 0.25s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .btn::before{
    content:\'\';
    position:absolute;
    inset:0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transform:translateX(-100%);
    transition:0.6s;
  }
  .btn:hover::before{transform:translateX(100%)}
  .btn:hover{
    transform:translateY(-2px) scale(1.02);
    border-color:rgba(255,180,60,0.6);
    box-shadow:0 12px 40px rgba(255,120,0,0.25), inset 0 1px 0 rgba(255,255,255,0.3);
    background: linear-gradient(180deg, rgba(255,180,60,0.18), rgba(255,100,0,0.08));
  }
  .btn.primary{
    background: linear-gradient(180deg, #ffb347 0%, #ff7a18 100%);
    color:#2b1600;
    border:none;
    box-shadow: 0 8px 30px rgba(255,122,24,0.5), inset 0 2px 0 rgba(255,255,255,0.6);
    font-size:18px;
  }
  .btn.primary:hover{
    background: linear-gradient(180deg, #ffc46b 0%, #ff8c2a 100%);
    box-shadow: 0 14px 40px rgba(255,122,24,0.65);
  }
  .menu-footer{
    margin-top:6px;
    font-size:10px;
    letter-spacing:3px;
    color:rgba(255,255,255,0.35);
    text-transform:uppercase;
  }

  /* Модалка */
  .modal{
    position:absolute;
    inset:0;
    background:rgba(2,5,16,0.75);
    backdrop-filter:blur(10px);
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .modal.active{display:flex}
  .modal-box{
    background: linear-gradient(180deg, #1a233a, #0f1422);
    border:1px solid rgba(255,220,150,0.2);
    border-radius:20px;
    padding:32px;
    width:420px;
    text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,0.6);
  }
  .modal-box h2{font-family:\'Cinzel\', serif; color:#ffcc6b; letter-spacing:4px; margin-bottom:16px}
  .modal-box p{color:rgba(255,255,255,0.7); font-size:14px; line-height:1.6; margin-bottom:24px}
</style>
</head>
<body>

<div class="sky">
  <div class="stars" id="stars"></div>
  <div class="moon"></div>
  <div class="mountains">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path d="M0,280 L120,120 L250,200 L400,60 L580,180 L720,40 L900,160 L1050,80 L1200,200 L1320,110 L1440,280 Z" fill="#0a0f24" opacity="0.9"></path>
      <path d="M0,280 L200,160 L340,210 L500,100 L650,200 L800,90 L1000,190 L1150,130 L1440,280 Z" fill="#111735" opacity="0.6"></path>
    </svg>
  </div>
</div>

<div class="title">
  <h1>EMBER PATH</h1>
  <p>Там, где гаснет свет — начинается путь</p>
</div>

<div class="scene" id="scene">
  <div class="ground"></div>

  <div class="stump left"></div>
  <div class="stump center"></div>
  <div class="stump right"></div>

  <div class="campfire-wrap">
    <div class="light-glow"></div>
    <div class="fire">
      <div class="flame"></div>
      <div class="flame"></div>
      <div class="flame"></div>
      <div class="particles" id="particles"></div>
    </div>
    <div class="logs">
      <div class="log log1"></div>
      <div class="log log2"></div>
      <div class="stones">
        <div class="stone"></div><div class="stone"></div><div class="stone"></div><div class="stone"></div><div class="stone"></div>
      </div>
    </div>
  </div>

  <div class="traveler">
    <div class="traveler-cloak"></div>
    <div class="traveler-body"></div>
    <div class="traveler-head">
      <div style="position:absolute; top:16px; left:9px; width:6px; height:6px; background:#3a2410; border-radius:50%"></div>
      <div style="position:absolute; top:16px; right:9px; width:6px; height:6px; background:#3a2410; border-radius:50%"></div>
      <div style="position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:10px; height:5px; background:#c68a5a; border-radius:0 0 10px 10px"></div>
    </div>
    <div class="traveler-hood"></div>
    <div class="traveler-hands">
      <div class="hand"></div>
      <div class="hand" style="animation-delay:0.3s"></div>
    </div>
  </div>
</div>

<div class="menu-panel">
  <button class="btn primary" onclick="showModal(\'Игра начинается...\',\'Твоё приключение у костра ждёт. Загрузка мира Ember Path...\')">Играть</button>
  <button class="btn" onclick="showModal(\'Настройки\',\'Здесь будут: Громкость • Графика • Управление • Язык\')">Настройки</button>
  <button class="btn" onclick="showModal(\'Выход\',\'Спасибо, что погрелся у нашего костра. До скорой встречи, путник!\')">Выход</button>
  <div class="menu-footer">v0.9.4 • Нажми [F] чтобы подбросить дров</div>
</div>

<div class="modal" id="modal" onclick="hideModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <button class="btn primary" style="padding:12px 0; font-size:14px" onclick="hideModal()">Понятно</button>
  </div>
</div>

<script>
  // Звезды
  const starsContainer = document.getElementById(\'stars\');
  for(let i=0;i<140;i++){
    const s = document.createElement(\'div\');
    s.className=\'star\';
    s.style.left = Math.random()*100 + \'%\';
    s.style.top = Math.random()*55 + \'%\';
    s.style.animationDelay = Math.random()*3 + \'s\';
    s.style.width = s.style.height = (Math.random()*2+1)+\'px\';
    starsContainer.appendChild(s);
  }
  // Искры костра
  const particles = document.getElementById(\'particles\');
  function spawnParticle(){
    const p = document.createElement(\'div\');
    p.className=\'particle\';
    p.style.left = 50 + (Math.random()*30-15) + \'px\';
    p.style.setProperty(\'--x\', (Math.random()*40-20)+\'px\');
    p.style.animationDuration = (1.5+Math.random()*1.5)+\'s\';
    particles.appendChild(p);
    setTimeout(()=>p.remove(),2500);
  }
  setInterval(spawnParticle,120);

  // Параллакс мышью
  const scene = document.getElementById(\'scene\');
  document.addEventListener(\'mousemove\', e=>{
    const x = (e.clientX / window.innerWidth - 0.5) * 20;
    const y = (e.clientY / window.innerHeight - 0.5) * 10;
    scene.style.transform = `rotateX(${8 - y}deg) rotateY(${x}deg)`;
  });

  // Модалки
  function showModal(title,text){
    document.getElementById(\'modalTitle\').innerText=title;
    document.getElementById(\'modalText\').innerText=text;
    document.getElementById(\'modal\').classList.add(\'active\');
  }
  function hideModal(){document.getElementById(\'modal\').classList.remove(\'active\');}

  // Эффект подброса дров
  document.addEventListener(\'keydown\', e=>{
    if(e.key.toLowerCase()===\'f\'){
      for(let i=0;i<8;i++) setTimeout(spawnParticle, i*60);
      document.querySelector(\'.fire\').style.transform=\'scale(1.15)\';
      setTimeout(()=> document.querySelector(\'.fire\').style.transform=\'scale(1)\',200);
    }
  });
</script>
</body>
</html>
