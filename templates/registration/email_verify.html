<!doctype html>
<html lang="ru">
<body style="margin:0;padding:0;background:#0f172a;font-family:system-ui,Segoe UI,Roboto,sans-serif;">
  <div style="max-width:520px;margin:0 auto;padding:32px 24px;">
    <h1 style="color:#a5b4fc;font-size:22px;margin:0 0 8px;">{{ site_name }}</h1>
    <p style="color:#cbd5e1;font-size:15px;line-height:1.6;">
      Здравствуйте, <strong>{{ user.username }}</strong>!
    </p>
    <p style="color:#cbd5e1;font-size:15px;line-height:1.6;">
      Спасибо за регистрацию. Подтвердите, пожалуйста, ваш email — нажмите на кнопку ниже.
    </p>
    <p style="text-align:center;margin:28px 0;">
      <a href="{{ url }}"
         style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;
                padding:12px 28px;border-radius:10px;font-weight:600;">
        Подтвердить email
      </a>
    </p>
    <p style="color:#94a3b8;font-size:13px;line-height:1.6;">
      Или скопируйте ссылку в браузер:<br>
      <span style="color:#818cf8;word-break:break-all;">{{ url }}</span>
    </p>
    <p style="color:#64748b;font-size:12px;line-height:1.6;margin-top:24px;">
      Ссылка действует 3 дня. Если вы не регистрировались — просто проигнорируйте это письмо.
    </p>
  </div>
</body>
</html>
